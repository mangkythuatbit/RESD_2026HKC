name: Run Python Script

# Kích hoạt khi bạn push code lên nhánh main hoặc chạy thủ công
on:
  push:
    branches: [ main ]
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên web

jobs:
  run-script:
    runs-on: ubuntu-latest # Sử dụng hệ điều hành Ubuntu làm terminal

    steps:
    # Bước 1: Tải code từ repo về máy ảo
    - name: Checkout repository code
      uses: actions/checkout@v4

    # Bước 2: Cài đặt môi trường Python trong terminal ảo
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Bạn có thể đổi thành phiên bản mình muốn

    # Bước 3: Cài đặt thư viện (nếu file code của bạn cần dùng)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Bước 4: Chạy file Python bằng lệnh terminal
    - name: Execute Python script
      run: |
        python tools/_pycache_/build_pages.cpython-313.pyc
